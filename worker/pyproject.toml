[project]
name = "verifier-worker"
version = "0.1.0"
description = "Claims jobs from Postgres and runs Batfish analysis for the verifier platform."
requires-python = ">=3.11,<3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "boto3>=1.35",
    "langchain-deepseek>=1.1.1",
    "langchain-openai>=1.8.0",
    "langchain-postgres>=0.0.19",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.22",
    "langgraph-checkpoint-postgres>=3.2.1",
    "netmiko>=4.8.0",
    "psycopg[binary]>=3.2",
    "pybatfish>=2025.7.7",
    "pypdf>=7.1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["verifier_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
