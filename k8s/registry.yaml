# Namespace and the in-cluster image registry. The registry runs on the app node's
# host network at :5000; both nodes pull registry.verifier.internal/* from it
# (see /etc/rancher/k3s/registries.yaml, written by main.tf).
apiVersion: v1
kind: Namespace
metadata:
  name: verifier
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: verifier
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: registry }
  template:
    metadata:
      labels: { app: registry }
    spec:
      hostNetwork: true
      nodeSelector: { role: app }
      containers:
        - name: registry
          image: registry:2
          env:
            - { name: REGISTRY_HTTP_ADDR, value: "0.0.0.0:5000" }
          volumeMounts:
            - { name: data, mountPath: /var/lib/registry }
      volumes:
        - name: data
          hostPath: { path: /var/lib/verifier/registry, type: DirectoryOrCreate }
