# Local development only. Credentials here are not for any shared environment.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: verifier
      POSTGRES_PASSWORD: verifier
      POSTGRES_DB: verifier
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verifier -d verifier"]
      interval: 2s
      timeout: 3s
      retries: 20

  # S3-compatible object store standing in for AWS S3 during local development.
  # It accepts any credentials, so it must never be exposed beyond localhost.
  s3:
    image: adobe/s3mock@sha256:ab01a6946750f451ca215a47e91030695b260e4003b8a5a6201d25029b8fca92
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: verifier-dev
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - s3data:/s3mockroot
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Long-lived Batfish instance. Parsed snapshots are kept in its data volume,
  # so a snapshot that was parsed once is not parsed again.
  batfish:
    image: batfish/allinone@sha256:54cb0ed94fd9a3c1ca0985f73e5be479e955cee9b9f6a6799b66be3364fd8e5c
    ports:
      - "127.0.0.1:9996:9996"
    volumes:
      - batfishdata:/data

volumes:
  pgdata:
  s3data:
  batfishdata:
